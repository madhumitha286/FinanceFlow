<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceFlow - Dashboard</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>

    <nav>
      <h1>FinanceFlow</h1>
      <a href="index.html">Dashboard</a>
      <a href="transactions.html">Transactions</a>
    </nav>

    <main>

      <h2>Dashboard</h2>

      <div class="summary">

        <div class="card">
           <h3>Total Balance</h3>
           <p id="balance">$0</p>
        </div>

        <div class="card">
          <h3>Total Income</h3>
          <p id="total-income">$0</p>
        </div>

        <div class="card">
          <h3>Total Expenses</h3>
          <p id="total-expense">$0</p>
        </div>

      </div>
      <section>
        <h2>Recent Transactions</h2>

        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Description</th>
              <th>Category</th>
              <th>Amount</th>
            </tr>
          </thead>
          <tbody id="transaction-body">
          </tbody>
        </table>
  </section>
    </main>
    <footer>
      <p>FinanceFlow - Track your money</p>
    </footer>
        <script src="app.js"></script>
 </body>
</html>
